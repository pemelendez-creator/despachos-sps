<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14366E">
<meta name="robots" content="noindex, nofollow">
<title>Despacho SPS · Chofer</title>
<link rel="icon" href="icon-192.png">
<script>
  // Guarda la página en el teléfono para poder abrirla sin señal
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("chofer-sw.js", {scope: "./chofer.html"}).catch(function(){});
  }
</script>
<style>
  :root{
    --navy:#14366E; --navy-dark:#0f2a55; --blue:#1F5BA6; --ink:#1b2430; --muted:#5b6b7c;
    --line:#d8e0ea; --bg:#f5f7fb; --ok:#2e7d52; --ok-soft:#e6f3ec; --warn:#b06a00; --warn-soft:#fff4e2;
    --danger:#b3261e; --danger-soft:#fbe9e7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
  header{background:linear-gradient(120deg,var(--navy),var(--navy-dark));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
  header img{width:44px;height:44px;border-radius:9px;background:#fff;padding:3px}
  header h1{margin:0;font-size:17px}
  header p{margin:1px 0 0;font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.04em}
  main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,54,110,.08)}
  .farmer{font-size:18px;font-weight:700;color:var(--navy);margin:0 0 6px}
  .row{display:flex;gap:8px;margin:4px 0;font-size:14.5px}
  .row span:first-child{flex:0 0 22px;text-align:center}
  .big{font-size:22px;font-weight:800;color:var(--navy)}
  .steps{display:flex;gap:8px;margin-bottom:14px}
  .step{flex:1;text-align:center;padding:9px 6px;border-radius:10px;background:#e8eef6;color:var(--muted);font-size:13px;font-weight:700}
  .step.on{background:var(--navy);color:#fff}
  .step.done{background:var(--ok-soft);color:var(--ok)}
  h2{margin:0 0 12px;font-size:18px}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
  input[type=text],input[type=number],textarea{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
  textarea{min-height:64px;resize:vertical}
  .photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #9fb4d3;border-radius:12px;padding:18px;text-align:center;color:var(--blue);font-weight:700;cursor:pointer;background:#f4f8fd}
  .photo img{max-width:100%;max-height:260px;border-radius:8px}
  .photo small{color:var(--muted);font-weight:500}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:800;color:#fff;background:var(--navy);margin-top:18px;cursor:pointer}
  .btn.go{background:#1f7a46}
  .btn:disabled{opacity:.55}
  .gps{font-size:13px;color:var(--muted);margin-top:10px}
  .msg{padding:12px 14px;border-radius:10px;font-size:14.5px;margin-top:12px}
  .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .msg.warn{background:var(--warn-soft);color:var(--warn)}
  .msg.err{background:var(--danger-soft);color:var(--danger)}
  .done{text-align:center}
  .done .ico{font-size:54px}
  .kv{font-size:14px;margin:3px 0}
  .kv b{color:var(--navy)}
  .hidden{display:none !important}
  .cam{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
  .cam video{flex:1;width:100%;height:100%;object-fit:cover;background:#000}
  .cam .bar{display:flex;gap:10px;padding:14px;background:#000;justify-content:space-between;align-items:center}
  .cam .shot{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#e53935;flex:none}
  .cam .side{background:transparent;border:1px solid #fff;color:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;min-width:96px}
  .cam .tip{position:absolute;top:0;left:0;right:0;padding:12px;color:#fff;text-align:center;font-weight:700;background:rgba(0,0,0,.45)}
  .center{text-align:center;color:var(--muted);padding:40px 10px}
  .net{position:sticky;top:0;z-index:20;background:#5b3a00;color:#fff;font-size:14px;font-weight:700;padding:9px 14px;text-align:center}
  .net.sync{background:#1F5BA6}
  .pend{display:inline-block;background:var(--warn-soft);color:var(--warn);border:1px solid #f0d9ab;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;margin-top:8px}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    initializeFirestore, persistentLocalCache, doc, getDoc, getDocFromServer, setDoc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDQ_6odz6hR4nBbiiNSrbCZzMOKK1aY38k",
    authDomain: "despachos-sps.firebaseapp.com",
    projectId: "despachos-sps",
    storageBucket: "despachos-sps.firebasestorage.app",
    messagingSenderId: "591821873195",
    appId: "1:591821873195:web:fcbffa0907857adb0dca6e"
  };
  // App con nombre propio: no toca la sesión de la app central
  const app = initializeApp(firebaseConfig, "chofer");
  let db;
  try{
    // Guarda en el teléfono lo pendiente si no hay señal y lo envía después
    db = initializeFirestore(app, { localCache: persistentLocalCache() });
  }catch(e){
    db = initializeFirestore(app, {});
  }
  window.FBC = { db, doc, getDoc, getDocFromServer, setDoc, updateDoc, serverTimestamp };
  window.dispatchEvent(new Event("fbc-ready"));
</script>
</head>
<body>
<header>
  <img src="icon-192.png" alt="SPS">
  <div>
    <h1>Despacho de bandejas</h1>
    <p>South Pacific Seeds Chile · Chofer</p>
  </div>
</header>
<div class="net hidden" id="netBar"></div>
<main id="main">
  <div class="center" id="loading">Cargando despacho…</div>
</main>

<script>
(function(){
  "use strict";
  var token = (new URLSearchParams(location.search).get("t") || "").trim();
  var main = document.getElementById("main");
  var entrega = null;
  var fotoData = null, fotoAt = "";
  var gps = null, gpsErr = "";

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtNum(n){ return (+n || 0).toLocaleString("es-CL"); }
  function fmtFecha(ds){
    if(!ds) return "";
    var p = String(ds).split("-");
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.toLocaleDateString("es-CL", {weekday:"long", day:"numeric", month:"long"});
  }
  function cap(t){ t = String(t || ""); return t.charAt(0).toUpperCase() + t.slice(1); }
  function fmtHora(iso){
    if(!iso) return "";
    var d = new Date(iso);
    return d.toLocaleString("es-CL", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
  }
  function lsGet(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

  function fail(msg){
    main.innerHTML = '<div class="card center"><div style="font-size:44px">⚠️</div><p>' + esc(msg) + '</p></div>';
  }

  /* ===== Copia local del despacho y cola de envíos (funciona sin señal) ===== */
  var KEY_E = "sps_entrega_" + token, KEY_Q = "sps_outbox_" + token;
  function jget(k){ try{ return JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ return null; } }
  function jset(k, v){ try{ if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function outbox(){ return jget(KEY_Q) || {}; }
  function pendientes(){ var q = outbox(); return ["inicio","termino"].filter(function(e){ return q[e]; }); }
  function guardarLocal(){ if(entrega) jset(KEY_E, entrega); }
  function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("timeout")); }, ms); })]); }

  function netBar(){
    var bar = document.getElementById("netBar"); if(!bar) return;
    var pend = pendientes();
    if(!navigator.onLine){
      bar.className = "net"; bar.textContent = "📵 Sin señal · puedes registrar igual: se enviará solo cuando vuelva la señal";
    } else if(pend.length){
      bar.className = "net sync"; bar.textContent = "📶 Enviando lo registrado sin señal…";
    } else { bar.className = "net hidden"; }
  }
  window.addEventListener("online", function(){ netBar(); flush(); });
  window.addEventListener("offline", netBar);

  var rendered = false;
  function start(){
    if(!/^[A-Za-z0-9]{20,}$/.test(token)){
      fail("El link no es válido. Pide a logística que te lo envíe de nuevo.");
      return;
    }
    netBar();
    // 1) Lo guardado en el teléfono se muestra al instante (sirve sin señal)
    var local = jget(KEY_E);
    if(local){ entrega = local; aplicarPendientes(); render(); rendered = true; }
    if(window.FBC) cargarServidor();
    else window.addEventListener("fbc-ready", cargarServidor, {once: true});
    setTimeout(function(){
      if(!rendered){
        fail(navigator.onLine
          ? "No se pudo cargar el despacho. Revisa tu señal e intenta de nuevo."
          : "📵 Sin señal. Este despacho aún no se ha abierto en este teléfono: ábrelo una vez con señal (por ejemplo en la bodega) y después funcionará aunque no haya señal.");
      }
    }, 12000);
  }
  // Las etapas registradas sin señal se muestran como hechas (pendientes de envío)
  function aplicarPendientes(){
    var q = outbox();
    ["inicio","termino"].forEach(function(e){
      if(q[e] && !entrega[e]) entrega[e] = Object.assign({}, q[e].data, {pendiente: true});
    });
  }
  // 2) Datos del servidor cuando hay señal
  function cargarServidor(){
    var ref = FBC.doc(FBC.db, "entregas", token);
    withTimeout(FBC.getDoc(ref), 8000).then(function(snap){
      if(!snap.exists()){
        if(!rendered) fail("No se encontró este despacho. Puede que aún se esté registrando: espera unos segundos y vuelve a abrir el link.");
        return;
      }
      var antes = entrega ? (!!entrega.inicio) + "" + (!!entrega.termino) : "";
      entrega = snap.data();
      aplicarPendientes();
      jset(KEY_E, limpiar(entrega));
      var ahora = (!!entrega.inicio) + "" + (!!entrega.termino);
      if(!rendered || antes !== ahora){ render(); rendered = true; }
      flush();
    }).catch(function(err){
      console.warn("[chofer] sin datos del servidor:", err && err.message);
      if(!rendered){
        fail(navigator.onLine
          ? "No se pudo cargar el despacho. Revisa tu señal e intenta de nuevo."
          : "📵 Sin señal. Este despacho aún no se ha abierto en este teléfono: ábrelo una vez con señal (por ejemplo en la bodega) y después funcionará aunque no haya señal.");
      }
      flush();
    });
  }
  // Quita valores que no se pueden guardar en el teléfono (marcas de tiempo del servidor)
  function limpiar(o){ return JSON.parse(JSON.stringify(o, function(k, v){ return (v && typeof v === "object" && typeof v.toDate === "function") ? null : v; })); }

  // 3) Envía la cola (al abrir, al volver la señal y al registrar)
  var enviando = {};
  function flush(){
    if(!window.FBC) return;
    pendientes().forEach(function(etapa){
      if(enviando[etapa]) return;
      if(etapa === "termino" && pendientes().indexOf("inicio") >= 0 && !enviando.inicio) return;  // primero el inicio
      enviando[etapa] = true;
      var item = outbox()[etapa];
      var jobs = [];
      if(item.foto){
        jobs.push(FBC.setDoc(FBC.doc(FBC.db, "entregasFotos", token + "_" + etapa), {
          token: token, etapa: etapa, data: item.foto, createdAt: FBC.serverTimestamp()
        }));
      }
      var upd = {updatedAt: FBC.serverTimestamp()};
      upd[etapa] = Object.assign({}, item.data, {at: FBC.serverTimestamp()});
      jobs.push(FBC.updateDoc(FBC.doc(FBC.db, "entregas", token), upd));
      Promise.all(jobs).then(function(){
        listo(etapa);
      }).catch(function(err){
        var perm = /permission|insufficient/i.test(err && err.message || "");
        if(perm){
          // ¿Ya había llegado (envío anterior)? Entonces no es error
          var ref = FBC.doc(FBC.db, "entregas", token);
          (FBC.getDocFromServer ? FBC.getDocFromServer(ref) : FBC.getDoc(ref)).then(function(snap){
            if(snap.exists() && snap.data()[etapa]) listo(etapa);
            else { enviando[etapa] = false; showMsgSafe("err", "Este despacho ya fue cerrado o el link no es válido. Contacta a logística."); }
          }).catch(function(){ enviando[etapa] = false; });
        } else {
          enviando[etapa] = false;
        }
      });
    });
    netBar();
  }
  function listo(etapa){
    enviando[etapa] = false;
    var q = outbox(); delete q[etapa]; jset(KEY_Q, Object.keys(q).length ? q : null);
    if(entrega && entrega[etapa]) delete entrega[etapa].pendiente;
    guardarLocal();
    netBar();
    var chip = document.getElementById("pend_" + etapa);
    if(chip){ chip.textContent = "✓ Enviado a logística"; chip.style.background = "var(--ok-soft)"; chip.style.color = "var(--ok)"; chip.style.borderColor = "#bfe0cd"; }
    if(pendientes().length) flush();
  }
  function showMsgSafe(cls, txt){ var m = document.getElementById("c_msg"); if(m) m.innerHTML = '<div class="msg ' + cls + '">' + txt + '</div>'; }

  function resumenHtml(){
    var r = entrega.resumen || {};
    var h = '<div class="card">'
      + '<div style="font-size:13px;color:var(--muted)">📅 ' + esc(cap(fmtFecha(r.fecha))) + '</div>'
      + '<p class="farmer">🌾 ' + esc(r.agricultor || "—") + '</p>';
    if(r.direccion) h += '<div class="row"><span>📍</span><span>' + esc(r.direccion) + '</span></div>';
    if(r.maps && /^https:\/\//.test(r.maps)) h += '<div class="row"><span>🧭</span><span><a href="' + esc(r.maps) + '" target="_blank" rel="noopener">Abrir en Google Maps</a></span></div>';
    if(r.telefono) h += '<div class="row"><span>📞</span><span><a href="tel:' + esc(String(r.telefono).replace(/\s/g,"")) + '">' + esc(r.telefono) + '</a></span></div>';
    h += '<div class="row" style="margin-top:8px"><span>📦</span><span class="big">' + fmtNum(r.bandejas) + ' bandejas</span></div>';
    if(+r.alveolos) h += '<div class="row"><span>🧊</span><span>Bandejas de ' + fmtNum(r.alveolos) + ' alvéolos</span></div>';
    if(r.camion) h += '<div class="row"><span>🚛</span><span>' + esc(r.camion) + '</span></div>';
    if(r.contrato || r.sps) h += '<div class="row"><span>🌱</span><span>Contrato ' + esc(r.contrato || "—") + ' · SPS ' + esc(r.sps || "—") + '</span></div>';
    if(r.obs) h += '<div class="row"><span>📝</span><span>' + esc(r.obs) + '</span></div>';
    return h + '</div>';
  }

  function stepsHtml(){
    var ini = !!entrega.inicio, fin = !!entrega.termino;
    return '<div class="steps">'
      + '<div class="step ' + (ini ? "done" : "on") + '">' + (ini ? "✓ " : "1 · ") + 'Inicio</div>'
      + '<div class="step ' + (fin ? "done" : (ini ? "on" : "")) + '">' + (fin ? "✓ " : "2 · ") + 'Entrega</div>'
      + '</div>';
  }

  function render(){
    fotoData = null; fotoAt = ""; gps = null; gpsErr = ""; stopCamera();
    var r = entrega.resumen || {};
    var h = stepsHtml() + resumenHtml();

    if(entrega.termino){
      var t = entrega.termino;
      h += '<div class="card done"><div class="ico">✅</div><h2>Entrega confirmada</h2>'
        + '<div class="kv">Recibió: <b>' + esc(t.recibio || "—") + '</b></div>'
        + '<div class="kv">Bandejas entregadas: <b>' + fmtNum(t.bandejas) + '</b></div>'
        + '<div class="kv">Hora: <b>' + esc(fmtHora(t.atLocal)) + '</b></div>'
        + (t.pendiente
            ? '<div class="pend" id="pend_termino">⏳ Guardado en el teléfono · se enviará solo cuando haya señal</div>'
            : '<p style="color:var(--muted);font-size:14px">Gracias. Logística ya recibió la confirmación.</p>') + '</div>';
      main.innerHTML = h;
      return;
    }

    var etapa = entrega.inicio ? "termino" : "inicio";
    if(etapa === "inicio"){
      h += '<div class="card"><h2>▶️ Iniciar despacho</h2>'
        + '<p style="margin:0;color:var(--muted);font-size:14px">Antes de salir, saca una foto de la carga.</p>'
        + '<label>Tu nombre</label><input type="text" id="c_nombre" autocomplete="name" value="' + esc(lsGet("sps_chofer_nombre")) + '" placeholder="Nombre del chofer">'
        + '<label>Bandejas cargadas</label><input type="number" id="c_bandejas" inputmode="numeric" min="0" value="' + (+r.bandejas || "") + '">';
    } else {
      var i = entrega.inicio;
      h += '<div class="card"><div class="msg ok" style="margin:0 0 12px">🚚 En ruta desde ' + esc(fmtHora(i.atLocal)) + ' · ' + fmtNum(i.bandejas) + ' bandejas cargadas'
        + (i.pendiente ? '<br><span class="pend" id="pend_inicio">⏳ Inicio guardado en el teléfono · se enviará solo cuando haya señal</span>' : '') + '</div>'
        + '<h2>✅ Confirmar entrega</h2>'
        + '<label>¿Quién recibió?</label><input type="text" id="c_recibio" placeholder="Nombre de quien recibe">'
        + '<label>Bandejas entregadas</label><input type="number" id="c_bandejas" inputmode="numeric" min="0" value="' + (+i.bandejas || +r.bandejas || "") + '">';
    }
    h += '<label>Foto ' + (etapa === "inicio" ? "de la carga" : "de la entrega o guía firmada") + '</label>'
      + '<div class="photo" id="photoBox" role="button" style="margin:0;color:var(--blue)">📷 Tomar foto<small>Se abre la cámara (no se pueden usar fotos de la galería)</small></div>'
      + '<label>Observaciones (opcional)</label><textarea id="c_obs" placeholder="Ej: faltó 1 bandeja, portón cerrado…"></textarea>'
      + '<div class="gps" id="gpsInfo">📍 Obteniendo ubicación…</div>'
      + '<button class="btn ' + (etapa === "inicio" ? "" : "go") + '" id="c_send">' + (etapa === "inicio" ? "▶️ Iniciar despacho" : "✅ Confirmar entrega") + '</button>'
      + '<div id="c_msg"></div></div>';
    main.innerHTML = h;

    document.getElementById("photoBox").addEventListener("click", function(){ openCamera(etapa); });
    document.getElementById("c_send").addEventListener("click", function(){ send(etapa); });
    askGps();
  }

  function askGps(){
    var el = document.getElementById("gpsInfo");
    if(!navigator.geolocation){ gpsErr = "sin GPS"; if(el) el.textContent = "📍 Este teléfono no entrega ubicación."; return; }
    navigator.geolocation.getCurrentPosition(function(p){
      gps = {lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), precision: Math.round(p.coords.accuracy)};
      if(el) el.textContent = "📍 Ubicación lista (±" + gps.precision + " m)";
    }, function(err){
      gpsErr = err && err.code === 1 ? "permiso denegado" : "no disponible";
      if(el) el.textContent = "📍 Sin ubicación (" + gpsErr + "). Puedes enviar igual.";
    }, {enableHighAccuracy: true, timeout: 20000, maximumAge: 60000});
  }

  /* ===== Cámara en vivo: la foto SOLO puede tomarse en el momento (sin galería) ===== */
  var camStream = null, camFacing = "environment";
  function stopCamera(){
    if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
    var o = document.getElementById("camOv"); if(o) o.remove();
  }
  function camHelp(msg){
    var box = document.getElementById("photoBox");
    if(box) box.innerHTML = "📷 " + msg + "<small>Toca aquí para intentar de nuevo</small>";
  }
  function openCamera(etapa){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      camHelp("Este navegador no permite usar la cámara. Abre el link en Chrome (Android) o Safari (iPhone).");
      return;
    }
    stopCamera();
    var ov = document.createElement("div");
    ov.className = "cam"; ov.id = "camOv";
    ov.innerHTML = '<video id="camVid" autoplay playsinline muted></video>'
      + '<div class="tip">' + (etapa === "inicio" ? "Foto de la carga" : "Foto de la entrega o guía firmada") + '</div>'
      + '<div class="bar"><button class="side" id="camX">✕ Cancelar</button>'
      + '<button class="shot" id="camShot" aria-label="Tomar foto" disabled></button>'
      + '<button class="side" id="camFlip">🔄 Girar</button></div>';
    document.body.appendChild(ov);
    document.getElementById("camX").onclick = stopCamera;
    document.getElementById("camFlip").onclick = function(){ camFacing = camFacing === "environment" ? "user" : "environment"; startStream(); };
    document.getElementById("camShot").onclick = function(){ capture(etapa); };
    startStream();
  }
  function startStream(){
    if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
    var vid = document.getElementById("camVid"), shot = document.getElementById("camShot");
    if(shot) shot.disabled = true;
    navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: camFacing}, width: {ideal: 1920}, height: {ideal: 1080}}, audio: false})
      .then(function(st){
        camStream = st;
        if(!document.getElementById("camOv")){ stopCamera(); return; }
        vid.srcObject = st;
        var p = vid.play(); if(p && p.catch) p.catch(function(){});
        vid.onloadedmetadata = function(){ if(shot) shot.disabled = false; };
        setTimeout(function(){ if(shot && vid.videoWidth) shot.disabled = false; }, 800);
      })
      .catch(function(err){
        stopCamera();
        var denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
        camHelp(denied
          ? "Debes permitir el uso de la cámara. Toca el candado 🔒 junto a la dirección → Permisos → Cámara → Permitir."
          : "No se pudo abrir la cámara (" + esc(err && err.name || "error") + ").");
      });
  }
  function two(n){ return (n < 10 ? "0" : "") + n; }
  // Toma la foto del video, la reduce (señal rural) y le estampa fecha, hora y GPS
  function capture(etapa){
    var vid = document.getElementById("camVid");
    if(!vid || !vid.videoWidth){ return; }
    var max = 1100, w = vid.videoWidth, h = vid.videoHeight;
    if(w > h && w > max){ h = Math.round(h * max / w); w = max; }
    else if(h >= w && h > max){ w = Math.round(w * max / h); h = max; }
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var g = c.getContext("2d");
    g.drawImage(vid, 0, 0, w, h);
    var d = new Date();
    var linea1 = "SPS · " + (etapa === "inicio" ? "INICIO" : "ENTREGA") + " · " + two(d.getDate()) + "-" + two(d.getMonth() + 1) + "-" + d.getFullYear() + " " + two(d.getHours()) + ":" + two(d.getMinutes());
    var linea2 = gps ? ("GPS " + gps.lat + ", " + gps.lng + " (±" + gps.precision + " m)") : "GPS no disponible";
    var fs = Math.max(14, Math.round(w / 40));
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, h - fs * 2.9, w, fs * 2.9);
    g.fillStyle = "#fff"; g.font = "bold " + fs + "px Arial, sans-serif";
    g.fillText(linea1, fs * 0.6, h - fs * 1.65);
    g.font = fs * 0.85 + "px Arial, sans-serif";
    g.fillText(linea2, fs * 0.6, h - fs * 0.55);
    var q = 0.72, data = c.toDataURL("image/jpeg", q);
    while(data.length > 420000 && q > 0.3){ q -= 0.1; data = c.toDataURL("image/jpeg", q); }
    stopCamera();
    fotoData = data; fotoAt = d.toISOString();
    var box = document.getElementById("photoBox");
    box.innerHTML = '<img src="' + data + '" alt="Foto"><small>Toca para tomar otra foto</small>';
  }

  function showMsg(cls, txt){
    document.getElementById("c_msg").innerHTML = '<div class="msg ' + cls + '">' + txt + '</div>';
  }

  function send(etapa){
    var btn = document.getElementById("c_send");
    var bandejas = parseInt(document.getElementById("c_bandejas").value, 10);
    var obs = document.getElementById("c_obs").value.trim();
    var data = {
      bandejas: isNaN(bandejas) ? 0 : bandejas,
      obs: obs,
      foto: !!fotoData,
      fotoCamara: !!fotoData,
      fotoAt: fotoAt || "",
      gps: gps,
      gpsError: gps ? "" : (gpsErr || "no disponible"),
      atLocal: new Date().toISOString(),
      sinSenal: !navigator.onLine
    };
    if(etapa === "inicio"){
      var nombre = document.getElementById("c_nombre").value.trim();
      if(!nombre){ showMsg("err", "Escribe tu nombre."); return; }
      if(isNaN(bandejas) || bandejas <= 0){ showMsg("err", "Indica las bandejas cargadas."); return; }
      lsSet("sps_chofer_nombre", nombre);
      data.chofer = nombre;
    } else {
      var recibio = document.getElementById("c_recibio").value.trim();
      if(!recibio){ showMsg("err", "Escribe quién recibió."); return; }
      if(isNaN(bandejas) || bandejas < 0){ showMsg("err", "Indica las bandejas entregadas."); return; }
      data.recibio = recibio;
      data.chofer = (entrega.inicio && entrega.inicio.chofer) || lsGet("sps_chofer_nombre");
    }
    if(!fotoData && !confirm("No agregaste foto. ¿Enviar de todas formas?")) return;
    btn.disabled = true;

    // Se guarda primero en el teléfono: aunque no haya señal o se cierre la página, no se pierde
    var q = outbox();
    q[etapa] = {data: data, foto: fotoData || null};
    try{ localStorage.setItem(KEY_Q, JSON.stringify(q)); }
    catch(e){
      // Sin espacio para la foto: se guarda sin ella antes que perder el registro
      q[etapa].foto = null; q[etapa].data.foto = false; q[etapa].data.fotoNoGuardada = true;
      jset(KEY_Q, q);
    }
    entrega[etapa] = Object.assign({}, data, {pendiente: true});
    guardarLocal();

    if(etapa === "inicio"){
      main.innerHTML = stepsHtml() + '<div class="card done"><div class="ico">🚚</div><h2>¡Despacho iniciado!</h2>'
        + '<div class="pend" id="pend_inicio">' + (navigator.onLine ? '📶 Enviando a logística…' : '⏳ Guardado en el teléfono · se enviará solo cuando haya señal') + '</div>'
        + '<p style="color:var(--muted)">Cuando entregues, vuelve a abrir <b>este mismo link</b> para confirmar la entrega (funciona aunque no tengas señal).</p>'
        + '<button class="btn go" id="c_next">Ir a confirmar entrega</button></div>';
      document.getElementById("c_next").addEventListener("click", function(){ render(); window.scrollTo(0,0); });
    } else {
      render();
      var chip = document.getElementById("pend_termino");
      if(chip && navigator.onLine) chip.textContent = "📶 Enviando a logística…";
    }
    window.scrollTo(0, 0);
    flush();
  }

  start();
  window.addEventListener("fbc-ready", flush);
})();
</script>
